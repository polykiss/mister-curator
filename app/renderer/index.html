<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      `blob:` in img-src is required by the round-7/8 box-art flow:
      `useBoxArt` reads bytes from the main process via IPC, wraps
      them in a Blob, and feeds the resulting `blob:` objectURL to
      `<img src>`. The bytes themselves come from our own image cache
      (downloaded server-side by `MetadataOrchestrator.getBoxArtBytes`),
      so allowing `blob:` here doesn't broaden the network surface —
      it just unblocks rendering of bytes the main process already
      vetted. Other directives stay locked down.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiSTerCurator</title>
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
